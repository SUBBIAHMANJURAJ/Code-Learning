<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons Assignment</title>
    <style>
        body{
            border: solid 1px black;
            width: 300px;
            padding: 10px;
        }
        h1{
            font-weight: bolder;
        }
        h3{
            color: green;
        }
        .Cart-Button{
            background-color: rgb(237, 237, 41);
            border-radius: 15px;
            height: 30px;
            width: 100px;cursor: pointer;
            color: black;
            border: none;

        }
        .Buynow-Button{
            background-color: orange;
            border-radius: 15px;
            height: 30px;
            width: 100px;
            cursor: pointer;
            color: black;
            border: none;
        }
        


    </style>
</head>
<body>
    <h1>Nike Black Running Shoes</h1>
<h3>$39, In Stock</h3>
<p>Free Delivery Tomorrow</p>
<button class="Cart-Button">Add to Cart</button>
<button class="Buynow-Button">Buy Now</button>
</body>
</html>
