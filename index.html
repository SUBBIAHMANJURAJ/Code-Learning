<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psedo Elements</title>
    <style>
        .red button{
            background-color: red;
            color: white;
            border-radius: 5px;
            height: 40px;
            width:150px;
            cursor: pointer;
            transition: 0.7s;
            font-size: larger;
            border: none;
            margin-left: 50%;
        }
        .red button:hover{
            color: rgb(250, 249, 252);
            transform: scale(1.3);
        }
        .blue button{
            background-color: rgb(13, 13, 13);
            color: white;
            border-radius: 5px;
            height: 40px;
            width:150px;
            cursor: pointer;
            font-size: larger;
            border: none;
            transition: 0.7s;
            margin-left: 30%;
            font-weight: bolder;
        }
        .blue button:hover{
            color: rgb(235, 234, 237);
            transform: scale(1.3);
        }
        .fb button{
            background-color: rgb(67, 100, 184);
            color: white;
            border-radius: 5px;
            height: 40px;
            width:150px;
            cursor: pointer;
            font-size: larger;
            border: none;
            transition: 0.7s;
            margin-left: 15%;
            font-weight: bold;
        }
        .fb button:hover{
            color: rgb(235, 234, 237);
            transform: scale(1.3);
        }
        
    </style>
</head>
<body>
    <div><a href="https://www.youtube.com/" target="_blank">Go to Youtube</a></div>
    <p>Nike Shoes are under development</p>
    <p>These are now available in offers!</p>
    <p>Click the below link to order now--></p>
    <button>Order Now</button><button>Add to Cart</button><br><br>
    <div class="red"><button>SUBSCRIBE</button></div>
    <br>
    <div class="blue"><button>X&nbsp;Tweater</button></div><br>
    <div class="fb"><button>Facebook</button></div>
    <br>
    <embed src="https://www.moviesda.red/tamilrockers/" frameborder="0"></embed>

</body>
</html>
